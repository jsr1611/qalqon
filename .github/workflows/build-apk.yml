name: Build Signed APK

on:
  # Manual only: run from the GitHub Actions tab ("Run workflow")
  # or locally with: gh workflow run build-apk.yml
  workflow_dispatch:
    inputs:
      track:
        description: 'Upload AAB to Google Play track (none = build only)'
        type: choice
        default: internal
        options: [none, internal, alpha, production]
      status:
        description: 'completed = roll out to testers now (falls back to draft while the app is unpublished)'
        type: choice
        default: completed
        options: [completed, draft]
      github_release:
        description: 'Publish the APK on the GitHub Releases page'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release
    env:
      # Auto-incrementing version so every build installs over the last.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install Android 36 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RECOVERY_SECRET: ${{ secrets.RECOVERY_SECRET }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (for Google Play)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RECOVERY_SECRET: ${{ secrets.RECOVERY_SECRET }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AqlliQalqon-v${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/AqlliQalqon-v${VERSION_NAME}.aab"

      - name: Publish GitHub Release
        if: inputs.github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## What's new"
            echo
            sed 's/^/- /' distribution/whatsnew/whatsnew-en-US
            echo
            echo "## Install"
            echo "Download **AqlliQalqon-v${VERSION_NAME}.apk** below, or update from Google Play if you're a tester. On Samsung you may need Auto Blocker off and, for the Accessibility step, \"Allow restricted settings\". If sideloading is blocked, install via \`adb install -r\`."
          } > release-notes.md
          gh release create "v${VERSION_NAME}" "dist/AqlliQalqon-v${VERSION_NAME}.apk" \
            --title "Aqlli Qalqon v${VERSION_NAME}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AqlliQalqon-v${{ env.VERSION_NAME }}
          path: dist/AqlliQalqon-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Upload AAB artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: AqlliQalqon-v${{ env.VERSION_NAME }}-play-aab
          path: dist/AqlliQalqon-v${{ env.VERSION_NAME }}.aab
          if-no-files-found: error

  upload:
    needs: build
    if: inputs.track != 'none'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: AqlliQalqon-v${{ env.VERSION_NAME }}-play-aab

      - name: Upload to Google Play
        id: upload
        continue-on-error: ${{ inputs.status == 'completed' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uz.jumanazar.qalqon
          releaseFiles: AqlliQalqon-v${{ env.VERSION_NAME }}.aab
          whatsNewDirectory: distribution/whatsnew
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      # Google only accepts draft releases while the app itself is still a
      # "Draft app" in Play Console. Fall back so the upload is never lost.
      - name: Upload as draft (app not yet published)
        if: steps.upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uz.jumanazar.qalqon
          releaseFiles: AqlliQalqon-v${{ env.VERSION_NAME }}.aab
          whatsNewDirectory: distribution/whatsnew
          track: ${{ inputs.track }}
          status: draft

      - name: Remind to roll out manually
        if: steps.upload.outcome == 'failure'
        run: echo "::warning::Saved as DRAFT (Google requires this until the app is published). Roll it out in Play Console > Internal testing."
